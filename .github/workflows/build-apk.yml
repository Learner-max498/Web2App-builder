            -H "Authorization: Bearer ${SUPA_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"download_url\":\"${SUPA_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.apk\",\"aab_url\":\"${SUPA_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.aab\"}"

          echo "Done!"

      - name: Mark build failed
        if: failure()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          SUPA_URL: ${{ secrets.SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -X PATCH "${SUPA_URL}/rest/v1/builds?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPA_KEY}" \
            -H "Authorization: Bearer ${SUPA_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Build failed - check GitHub Actions logs for details"}'
