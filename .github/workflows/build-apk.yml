name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      job_id:
        description: 'Job ID'
        required: true
      icon_path:
        description: 'Icon Path'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android Project
        run: |
          PKG_NAME="com.web2app.webbrowser"
          mkdir -p app/src/main/java/com/web2app/webbrowser/
          mkdir -p gradle/wrapper/
          mkdir -p app/src/main/res/mipmap-hdpi/
          mkdir -p app/src/main/res/values/

          # Create AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.web2app.webbrowser">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          # Create MainActivity.java
          cat > app/src/main/java/com/web2app/webbrowser/MainActivity.java << 'JAVA_EOF'
          package com.web2app.webbrowser;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${{ github.event.inputs.url }}");
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA_EOF

          # Create gradle.properties
          cat > gradle.properties << 'GRADLE_PROP_EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          GRADLE_PROP_EOF

          # Create app/build.gradle
          cat > app/build.gradle << 'APP_GRADLE_EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.web2app.webbrowser'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.web2app.webbrowser'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          APP_GRADLE_EOF

          # Create settings.gradle
          cat > settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Web2App"
          include ':app'
          SETTINGS_EOF

          # Create build.gradle
          cat > build.gradle << 'BUILD_EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          BUILD_EOF

          # Create gradle wrapper properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'WRAPPER_EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER_EOF

          # Download gradlew
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -O gradlew
          chmod +x gradlew

          # Download gradle-wrapper.jar
          wget -q "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
            -O gradle/wrapper/gradle-wrapper.jar

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Supabase and mark complete
        if: success()
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -1)
          FILENAME="${{ github.event.inputs.job_id }}.apk"

          curl -s -X POST "${{ secrets.SUPABASE_URL }}/storage/v1/object/apk-builds/${FILENAME}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${APK_FILE}"

          DOWNLOAD_URL="${{ secrets.SUPABASE_URL }}/storage/v1/object/public/apk-builds/${FILENAME}"

          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/builds?id=eq.${{ github.event.inputs.job_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"progress\":\"Done\",\"download_url\":\"${DOWNLOAD_URL}\"}"

      - name: Mark build failed
        if: failure()
        run: |
          curl -s -X PATCH "${{ secrets.SUPABASE_URL }}/rest/v1/builds?id=eq.${{ github.event.inputs.job_id }}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","progress":"Build error"}'