name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      job_id:
        description: 'Job ID'
        required: true
      icon_path:
        description: 'Icon Path'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip unzip curl

      - name: Install Gradle 8
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Generate Android Project
        shell: bash
        env:
          APP_URL: ${{ github.event.inputs.url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_PATH: ${{ github.event.inputs.icon_path }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
        run: |
          set -e

          PKG_SUFFIX=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_$//' | cut -c1-20)
          PKG_NAME="com.web2app.${PKG_SUFFIX}"
          JAVA_DIR="app/src/main/java/$(echo $PKG_NAME | tr '.' '/')"

          mkdir -p "$JAVA_DIR"
          mkdir -p app/src/main/res/{mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi,mipmap-anydpi-v26,drawable,values}

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="AppTheme" parent="android:Theme.Black">' '        <item name="android:windowBackground">@android:color/black</item>' '        <item name="android:windowNoTitle">true</item>' '        <item name="android:windowFullscreen">false</item>' '    </style>' '</resources>' > app/src/main/res/values/styles.xml

          ICON_ATTR=""

          if [ -n "$ICON_PATH" ]; then
            curl -sf "${PROJECT_URL}/storage/v1/object/public/app-icons/${ICON_PATH}" -o /tmp/icon.png || true
            if file /tmp/icon.png | grep -q image; then
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert /tmp/icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@android:color/transparent"/>' '    <foreground android:drawable="@mipmap/ic_launcher"/>' '</adaptive-icon>' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
              ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
            fi
          fi

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n\n    <application\n        android:label="%s"\n        android:theme="@style/AppTheme"\n        android:usesCleartextTraffic="true"\n        %s>\n\n        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN"/>\n                <category android:name="android.intent.category.LAUNCHER"/>\n            </intent-filter>\n\n        </activity>\n\n    </application>\n\n</manifest>\n' "$APP_NAME" "$ICON_ATTR" > app/src/main/AndroidManifest.xml

          printf 'package %s;\n\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebSettings;\n\npublic class MainActivity extends Activity {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\n        WebView webView = new WebView(this);\n        setContentView(webView);\n\n        WebSettings s = webView.getSettings();\n        s.setJavaScriptEnabled(true);\n        s.setDomStorageEnabled(true);\n\n        webView.setWebViewClient(new WebViewClient());\n\n        webView.loadUrl("%s");\n    }\n}\n' "$PKG_NAME" "$APP_URL" > "$JAVA_DIR/MainActivity.java"

          printf '%s\n' 'apply plugin: "com.android.application"' "android {" "    namespace \"${PKG_NAME}\"" '    compileSdkVersion 33' '    defaultConfig {' '        minSdkVersion 21' '        targetSdkVersion 33' '    }' '}' > app/build.gradle

      - name: Create Gradle Build Files
        run: |
          printf '%s\n' 'rootProject.name = "WebViewApp"' 'include ":app"' > settings.gradle

          printf '%s\n' 'buildscript {' '    repositories { google(); mavenCentral() }' '    dependencies { classpath "com.android.tools.build:gradle:8.0.2" }' '}' 'allprojects {' '    repositories { google(); mavenCentral() }' '}' > build.gradle

      - name: Build APK and AAB
        run: |
          set -e
          gradle assembleDebug --no-daemon
          gradle bundleDebug --no-daemon

      - name: Upload Build to Supabase
        if: success()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          curl -sf -X POST "${PROJECT_URL}/storage/v1/object/apk-builds/${JOB_ID}.apk" \
            -H "Authorization: Bearer ${SRV_KEY}" \
            -H "apikey: ${SRV_KEY}" \
            --data-binary @"${APK_FILE}"

          AAB_FILE=$(find app/build/outputs/bundle/debug -name "*.aab" | head -1)
          if [ -n "$AAB_FILE" ]; then
            curl -sf -X POST "${PROJECT_URL}/storage/v1/object/apk-builds/${JOB_ID}.aab" \
              -H "Authorization: Bearer ${SRV_KEY}" \
              -H "apikey: ${SRV_KEY}" \
              --data-binary @"${AAB_FILE}"
          fi

      - name: Update Build Status - Success
        if: success()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          curl -sf -X PATCH "${PROJECT_URL}/rest/v1/builds?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SRV_KEY}" \
            -H "apikey: ${SRV_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"completed\", \"download_url\": \"${PROJECT_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.apk\", \"aab_url\": \"${PROJECT_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.aab\"}" || true

      - name: Update Build Status - Failed
        if: failure()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          curl -sf -X PATCH "${PROJECT_URL}/rest/v1/builds?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SRV_KEY}" \
            -H "apikey: ${SRV_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "failed", "error": "Build failed"}' || true