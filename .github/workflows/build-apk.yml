name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      job_id:
        description: 'Job ID'
        required: true
      icon_path:
        description: 'Icon Path'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip unzip curl

      - name: Generate Android Project
        shell: bash
        env:
          APP_URL: ${{ github.event.inputs.url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_PATH: ${{ github.event.inputs.icon_path }}
          SUPA_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e

          # ----------------------------
          # Package name
          # ----------------------------
          PKG_SUFFIX=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_$//' | cut -c1-20)
          PKG_NAME="com.web2app.${PKG_SUFFIX}"
          JAVA_DIR="app/src/main/java/$(echo $PKG_NAME | tr '.' '/')"

          mkdir -p "$JAVA_DIR"
          mkdir -p app/src/main/res/{mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi,mipmap-anydpi-v26,drawable,values}

          echo "Package: $PKG_NAME"

          # ----------------------------
          # styles.xml (SAFE)
          # ----------------------------
          cat > app/src/main/res/values/styles.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="android:Theme.Black">
        <item name="android:windowBackground">@android:color/black</item>
        <item name="android:windowNoTitle">true</item>
        <item name="android:windowFullscreen">false</item>
    </style>
</resources>
EOF

          # ----------------------------
          # ICONS (optional)
          # ----------------------------
          ICON_ATTR=""

          if [ -n "$ICON_PATH" ]; then
            curl -sf "${SUPA_URL}/storage/v1/object/public/app-icons/${ICON_PATH}" -o /tmp/icon.png || true

            if file /tmp/icon.png | grep -q image; then
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert /tmp/icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png

              cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@android:color/transparent"/>
    <foreground android:drawable="@mipmap/ic_launcher"/>
</adaptive-icon>
EOF

              ICON_ATTR='android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
            fi
          fi

          # ----------------------------
          # AndroidManifest (SAFE)
          # ----------------------------
          cat > app/src/main/AndroidManifest.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="${PKG_NAME}">

    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

    <application
        android:label="${APP_NAME}"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true"
        ${ICON_ATTR}>

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          # ----------------------------
          # MainActivity (clean)
          # ----------------------------
          cat > ${JAVA_DIR}/MainActivity.java <<EOF
package ${PKG_NAME};

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebSettings;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);
        setContentView(webView);

        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);

        webView.setWebViewClient(new WebViewClient());

        webView.loadUrl("${APP_URL}");
    }
}
EOF

      - name: Build APK
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon

      - name: Upload Build (Supabase)
        if: success()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          SUPA_URL: ${{ secrets.SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)

          curl -sf -X POST "${SUPA_URL}/storage/v1/object/apk-builds/${JOB_ID}.apk" \
            -H "Authorization: Bearer ${SUPA_KEY}" \
            -H "apikey: ${SUPA_KEY}" \
            --data-binary @"${APK_FILE}"

      - name: Mark Failed
        if: failure()
        run: |
          echo "Build failed"