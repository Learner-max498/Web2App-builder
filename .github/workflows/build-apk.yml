name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
      app_name:
        description: 'App Name'
        required: true
      job_id:
        description: 'Job ID'
        required: true
      icon_path:
        description: 'Icon Path'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick zip unzip curl

      - name: Install Gradle 8
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Generate Android Project
        shell: bash
        env:
          APP_URL: ${{ github.event.inputs.url }}
          APP_NAME: ${{ github.event.inputs.app_name }}
          ICON_PATH: ${{ github.event.inputs.icon_path }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
        run: |
          set -e

          PKG_SUFFIX=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '_' | sed 's/^_//;s/_$//' | cut -c1-20)
          PKG_NAME="com.web2app.${PKG_SUFFIX}"
          JAVA_DIR="app/src/main/java/$(echo $PKG_NAME | tr '.' '/')"

          mkdir -p "$JAVA_DIR"
          mkdir -p app/src/main/res/{mipmap-hdpi,mipmap-mdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi,mipmap-anydpi-v26,drawable,values}

          # styles.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="AppTheme" parent="android:Theme.Black">' '        <item name="android:windowBackground">@android:color/black</item>' '        <item name="android:windowNoTitle">true</item>' '        <item name="android:windowFullscreen">false</item>' '    </style>' '</resources>' > app/src/main/res/values/styles.xml

          # Default icon (purple square)
          convert -size 192x192 xc:'#8c36ff' app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert -size 144x144 xc:'#8c36ff' app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 96x96 xc:'#8c36ff' app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 72x72 xc:'#8c36ff' app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 48x48 xc:'#8c36ff' app/src/main/res/mipmap-mdpi/ic_launcher.png

          # Adaptive icon XML
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@android:color/transparent"/>
    <foreground android:drawable="@mipmap/ic_launcher"/>
</adaptive-icon>
EOF

          # Override with custom icon if provided
          if [ -n "$ICON_PATH" ]; then
            curl -sf "${PROJECT_URL}/storage/v1/object/public/app-icons/${ICON_PATH}" -o /tmp/icon.png || true
            if file /tmp/icon.png | grep -q image; then
              convert /tmp/icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert /tmp/icon.png -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert /tmp/icon.png -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
            fi
          fi

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    package="$PKG_NAME">

    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

    <application
        android:label="$APP_NAME"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          # MainActivity.java
          cat > ${JAVA_DIR}/MainActivity.java <<EOF
package $PKG_NAME;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebSettings;

public class MainActivity extends Activity {

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        WebView webView = new WebView(this);
        setContentView(webView);

        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);

        webView.setWebViewClient(new WebViewClient());

        webView.loadUrl("$APP_URL");
    }
}
EOF

          # app/build.gradle
          cat > app/build.gradle <<EOF
apply plugin: 'com.android.application'

android {
    namespace "$PKG_NAME"
    compileSdk 34
    
    defaultConfig {
        applicationId "$PKG_NAME"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
rootProject.name = "WebViewApp"
include ':app'
EOF

          # build.gradle (project level)
          cat > build.gradle <<'EOF'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

      - name: Create Gradle Build Files
        run: |
          printf '%s\n' 'rootProject.name = "WebViewApp"' 'include ":app"' > settings.gradle
          printf '%s\n' 'buildscript {' '    repositories { google(); mavenCentral() }' '    dependencies { classpath "com.android.tools.build:gradle:8.0.2" }' '}' 'allprojects {' '    repositories { google(); mavenCentral() }' '}' > build.gradle

      - name: Build APK and AAB
        run: |
          set -e
          gradle assembleDebug --no-daemon
          gradle bundleDebug --no-daemon

      - name: Upload Build to Supabase
        if: success()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK_FILE" ]; then
            curl -sf -X POST "${PROJECT_URL}/storage/v1/object/apk-builds/${JOB_ID}.apk" \
              -H "Authorization: Bearer ${SRV_KEY}" \
              -H "apikey: ${SRV_KEY}" \
              --data-binary @"${APK_FILE}"
          fi

          AAB_FILE=$(find app/build/outputs/bundle/debug -name "*.aab" | head -1)
          if [ -n "$AAB_FILE" ]; then
            curl -sf -X POST "${PROJECT_URL}/storage/v1/object/apk-builds/${JOB_ID}.aab" \
              -H "Authorization: Bearer ${SRV_KEY}" \
              -H "apikey: ${SRV_KEY}" \
              --data-binary @"${AAB_FILE}"
          fi

      - name: Update Build Status - Success
        if: success()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          curl -sf -X PATCH "${PROJECT_URL}/rest/v1/builds?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SRV_KEY}" \
            -H "apikey: ${SRV_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"completed\", \"download_url\": \"${PROJECT_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.apk\", \"aab_url\": \"${PROJECT_URL}/storage/v1/object/public/apk-builds/${JOB_ID}.aab\"}" || true

      - name: Update Build Status - Failed
        if: failure()
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          PROJECT_URL: ${{ secrets.PROJECT_URL }}
          SRV_KEY: ${{ secrets.SRV_KEY }}
        run: |
          curl -sf -X PATCH "${PROJECT_URL}/rest/v1/builds?id=eq.${JOB_ID}" \
            -H "Authorization: Bearer ${SRV_KEY}" \
            -H "apikey: ${SRV_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"status": "failed", "error": "Build failed"}' || true