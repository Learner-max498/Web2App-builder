- name: Create build.gradle files
  run: |
    cat > app/build.gradle << 'EOF'
    plugins {
        id 'com.android.application'
    }
    
    android {
        compileSdk 34
        
        defaultConfig {
            applicationId "com.web2app.${{ github.event.inputs.app_name }}"
            minSdk 21
            targetSdk 34
            versionCode 1
            versionName "1.0"
        }
        
        buildTypes {
            release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            }
        }
    }
    
    dependencies {
        implementation 'androidx.appcompat:appcompat:1.6.1'
    }
    EOF
    
    cat > settings.gradle << 'EOF'
    pluginManagement {
        repositories {
            google()
            mavenCentral()
            gradlePluginPortal()
        }
    }
    dependencyResolutionManagement {
        repositories {
            google()
            mavenCentral()
        }
    }
    rootProject.name = "Web2App"
    include ':app'
    EOF
    
    cat > build.gradle << 'EOF'
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.1.4'
        }
    }
    tasks.register('clean', Delete) {
        delete rootProject.buildDir
    }
    EOF
    
    mkdir -p gradle/wrapper
    cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
    distributionBase=GRADLE_USER_HOME
    distributionPath=wrapper/dists
    distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
    zipStoreBase=GRADLE_USER_HOME
    zipStorePath=wrapper/dists
    EOF
    
    wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew -O gradlew
    chmod +x gradlew
    
    # Download the missing gradle-wrapper.jar
    wget -q "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar" \
      -O gradle/wrapper/gradle-wrapper.jar