<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropKit — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; min-height: 100vh; background: #000; color: white; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
    .bg { position: fixed; inset: 0; z-index: 0; }
    .leak { position: absolute; width: 100%; height: 350px; top: 0; left: 0; background: linear-gradient(180deg, rgba(128,0,255,0.12) 0%, transparent 100%); }
    .bottom-glow { position: fixed; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(0deg, rgba(128,0,255,0.08) 0%, transparent 100%); z-index: 1; pointer-events: none; }
    .card { position: relative; z-index: 10; max-width: 400px; width: 100%; background: rgba(20,20,20,0.9); border: 1px solid rgba(128,0,255,0.25); border-radius: 28px; padding: 36px 26px; backdrop-filter: blur(20px); box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700; text-align: center; color: #8c36ff; text-shadow: 0 4px 20px rgba(140,54,255,0.4); margin-bottom: 6px; }
    .icon-wrap { text-align: center; font-size: 42px; margin-bottom: 12px; }
    h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 26px; line-height: 1.5; }
    .field { margin-bottom: 14px; position: relative; }
    .field label { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
    .field input { width: 100%; padding: 13px 44px 13px 15px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(128,0,255,0.25); border-radius: 13px; color: white; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
    .field input::placeholder { color: rgba(255,255,255,0.3); }
    .field input:focus { border-color: #8c36ff; }
    .eye-toggle { position: absolute; right: 14px; bottom: 13px; cursor: pointer; color: rgba(255,255,255,0.4); font-size: 16px; transition: color 0.2s; }
    .eye-toggle:hover { color: #8c36ff; }
    .btn { width: 100%; padding: 15px; background: #8c36ff; color: white; border: none; border-radius: 13px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 6px; box-shadow: 0 6px 20px rgba(140,54,255,0.4); transition: transform 0.12s; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .back-link { text-align: center; margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.4); }
    .back-link a { color: #c7b2ff; text-decoration: none; font-weight: 700; }
    .back-link a:hover { color: #8c36ff; }
    .strength-bar { height: 3px; border-radius: 10px; background: rgba(255,255,255,0.1); margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; border-radius: 10px; transition: width 0.3s, background 0.3s; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(20,20,20,0.95); color: white; padding: 11px 22px; border-radius: 30px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.28s; z-index: 9000; pointer-events: none; max-width: 88%; text-align: center; backdrop-filter: blur(10px); border: 1px solid #8c36ff; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: rgba(180,40,40,0.95); border-color: #ff4444; }
    .toast.ok { background: rgba(0,120,80,0.95); border-color: #00cc88; }
    .bsp { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #8c36ff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="bg"><div class="leak"></div></div>
<div class="bottom-glow"></div>
<div class="card">
  <div class="logo">DropKit</div>
  <div class="icon-wrap">🔑</div>
  <h2>Set New Password</h2>
  <p class="sub">Enter a strong new password for your account</p>
  <div class="field">
    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
    <span class="eye-toggle" onclick="toggleEye('newPassword', this)"><i class="far fa-eye"></i></span>
    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Repeat your password">
    <span class="eye-toggle" onclick="toggleEye('confirmPassword', this)"><i class="far fa-eye"></i></span>
  </div>
  <button class="btn" id="resetBtn" onclick="updatePassword()">Update Password →</button>
  <p class="back-link"><a href="index.html">← Back to Sign In</a></p>
</div>
<div class="toast" id="toast"></div>
<script>
  const _sb = window.supabase.createClient(
    "https://jxdobdllxihmfssodrka.supabase.co",
    "sb_publishable_c6Rv2f_Rfgk6PDHVYBAcvQ_VxC2rENW"
  );

  async function init() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (accessToken) {
      const { error } = await _sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });
      if (error) { toast('Invalid or expired reset link.', 'err'); setTimeout(() => location.href = 'index.html', 2500); return; }
    }
    const { data: { session } } = await _sb.auth.getSession();
    if (!session) { toast('No valid session. Request a new reset link.', 'err'); setTimeout(() => location.href = 'index.html', 2500); }
  }

  function toggleEye(id, el) {
    const input = document.getElementById(id);
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    el.innerHTML = visible ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
  }

  function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#ff4444', '#ff8800', '#ffcc00', '#00cc88'];
    fill.style.width = (score * 25) + '%';
    fill.style.background = colors[score - 1] || 'transparent';
  }

  let toastTimer;
  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  function setBtn(loading) {
    const b = document.getElementById('resetBtn');
    b.disabled = loading;
    b.innerHTML = loading ? '<span class="bsp"></span>Updating...' : 'Update Password →';
  }

  async function updatePassword() {
    const newPass = document.getElementById('newPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;
    if (!newPass || !confirmPass) return toast('Please fill in both fields.', 'err');
    if (newPass.length < 8) return toast('Password must be at least 8 characters.', 'err');
    if (newPass !== confirmPass) return toast('Passwords do not match.', 'err');
    setBtn(true);
    const { error } = await _sb.auth.updateUser({ password: newPass });
    setBtn(false);
    if (error) return toast(error.message, 'err');
    toast('Password updated! Redirecting...', 'ok');
    await _sb.auth.signOut();
    setTimeout(() => location.href = 'index.html', 2000);
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') updatePassword(); });
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
