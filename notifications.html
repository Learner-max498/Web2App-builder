<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devra — Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #000;
      color: white;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(128,0,255,0.15) 0%, #000000 70%);
    }
    .page {
      position: relative;
      z-index: 10;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 24px; padding-top: 12px; gap: 12px; }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: #8c36ff;
      text-decoration: none;
    }
    .nav-icons {
      display: flex;
      gap: 22px;
    }
    .nav-icon {
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-icon:hover {
      color: #8c36ff;
    }
    .card {
      background: rgba(20,20,20,0.7);
      border: 1px solid rgba(128,0,255,0.25);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(20px);
    }
    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mark-all {
      font-size: 12px;
      color: #8c36ff;
      cursor: pointer;
    }
    .notification-item {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 12px;
    }
    .notification-item:hover {
      background: rgba(128,0,255,0.05);
    }
    .notification-item.unread {
      background: rgba(128,0,255,0.08);
      border-left: 3px solid #8c36ff;
    }
    .notification-title {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .notification-message {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .notification-date {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .unread-dot {
      width: 8px;
      height: 8px;
      background: #8c36ff;
      border-radius: 50%;
      display: inline-block;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.4);
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(20,20,20,0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.28s;
      z-index: 9000;
      pointer-events: none;
      backdrop-filter: blur(10px);
      border: 1px solid #8c36ff;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: rgba(180,40,40,0.95); border-color: #ff4444; }
    .toast.ok { background: rgba(0,120,80,0.95); border-color: #00cc88; }
  </style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="header">
    <a href="builder.html" class="logo">Devra</a>
    <div class="nav-icons">
      <i class="fas fa-globe nav-icon" onclick="location.href='sites.html'"></i>
      <i class="fas fa-history nav-icon" onclick="location.href='builds.html'"></i>
      <i class="fas fa-user nav-icon" onclick="location.href='account.html'"></i>
      <i class="fas fa-sign-out-alt nav-icon" onclick="logout()"></i>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span><i class="fas fa-bell" style="color:#8c36ff"></i> Notifications</span>
      <span class="mark-all" onclick="markAllRead()">Mark all as read</span>
    </div>
    <div id="notificationsList">
      <div class="empty-state">
        <i class="fas fa-spinner fa-pulse"></i> Loading...
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://jxdobdllxihmfssodrka.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_c6Rv2f_Rfgk6PDHVYBAcvQ_VxC2rENW";

  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let notifications = [];

  async function checkAuth() {
    let { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      // Wait for auth state in case token is refreshing
      await new Promise(resolve => {
        const { data: { subscription } } = _supabase.auth.onAuthStateChange((event, sess) => {
          subscription.unsubscribe();
          session = sess;
          resolve();
        });
        setTimeout(resolve, 2000);
      });
    }
    if (!session || !session.user) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;
    await loadNotifications();
    
    // Subscribe to new notifications
_supabase.channel('notifications')
      .on('postgres_changes', { 
        event: 'INSERT', 
        schema: 'public', 
        table: 'notifications',
        filter: `user_id=eq.${currentUser.id}`
      }, payload => {
        notifications.unshift(payload.new);
        renderNotifications();
      })
      .subscribe();
  }

  async function loadNotifications() {
    const { data, error } = await supabase
      .from('notifications')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      document.getElementById('notificationsList').innerHTML = '<div class="empty-state">Failed to load notifications</div>';
      return;
    }

    notifications = data || [];
    renderNotifications();
  }

  function renderNotifications() {
    const container = document.getElementById('notificationsList');
    
    if (notifications.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="far fa-bell-slash"></i><br>No notifications yet</div>';
      return;
    }

    container.innerHTML = notifications.map(notif => `
      <div class="notification-item ${!notif.is_read ? 'unread' : ''}" onclick="markRead('${notif.id}')">
        <div class="notification-title">
          ${!notif.is_read ? '<span class="unread-dot"></span>' : ''}
          ${escapeHtml(notif.title)}
        </div>
        <div class="notification-message">${escapeHtml(notif.message)}</div>
        <div class="notification-date">${formatDate(notif.created_at)}</div>
      </div>
    `).join('');
  }

  async function markRead(notificationId) {
    const { error } = await supabase
      .from('notifications')
      .update({ is_read: true })
      .eq('id', notificationId);

    if (!error) {
      const notif = notifications.find(n => n.id === notificationId);
      if (notif) notif.is_read = true;
      renderNotifications();
    }
  }

  async function markAllRead() {
    const { error } = await supabase
      .from('notifications')
      .update({ is_read: true })
      .eq('user_id', currentUser.id);

    if (!error) {
      notifications.forEach(n => n.is_read = true);
      renderNotifications();
      toast('All notifications marked as read', 'ok');
    }
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diffMs = now - date;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);

    if (diffMins < 1) return 'Just now';
    if (diffMins < 60) return `${diffMins} min ago`;
    if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
    return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
  }

  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  async function logout() {
    await _supabase.auth.signOut();
    window.location.href = 'index.html';
  }

  window.markRead = markRead;
  window.markAllRead = markAllRead;
  window.logout = logout;

  checkAuth();
</script>
</body>
</html>
