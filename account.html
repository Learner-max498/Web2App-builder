<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devra — Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: #000;
      color: white;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(128,0,255,0.15) 0%, #000000 70%);
    }
    .page {
      position: relative;
      z-index: 10;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    /* header handled */
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #8c36ff;
      text-decoration: none;
    }
    .nav-icons {
      display: flex;
      gap: 18px;
    }
    .nav-icon {
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-icon:hover, .nav-icon.active {
      color: #8c36ff;
    }
    .nav-icon-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    }
    .nav-icon-wrap .nav-icon { font-size: 20px; }
    .nav-icon-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
    }
    .nav-icon-wrap:hover .nav-icon, .nav-icon-wrap.active .nav-icon { color: #8c36ff; }
    .nav-icon-wrap:hover .nav-icon-label, .nav-icon-wrap.active .nav-icon-label { color: #8c36ff; }
    .dk-dialog-overlay { display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:24px; }
    .dk-dialog-overlay.show { display:flex; }
    .dk-dialog { background:rgba(20,20,20,0.98); border:1px solid rgba(128,0,255,0.4); border-radius:24px; padding:28px 24px; width:100%; max-width:340px; box-shadow:0 20px 60px rgba(0,0,0,0.8); animation:dialogPop 0.2s ease; }
    @keyframes dialogPop { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
    .dk-dialog-icon { font-size:32px; text-align:center; margin-bottom:12px; }
    .dk-dialog-title { font-family:'Plus Jakarta Sans',sans-serif; font-size:17px; font-weight:800; text-align:center; margin-bottom:8px; }
    .dk-dialog-msg { font-size:13px; color:rgba(255,255,255,0.6); text-align:center; line-height:1.6; margin-bottom:20px; }
    .dk-dialog-input { width:100%; padding:12px 14px; background:rgba(0,0,0,0.5); border:1.5px solid rgba(128,0,255,0.3); border-radius:12px; color:white; font-size:14px; outline:none; margin-bottom:16px; }
    .dk-dialog-btns { display:flex; gap:10px; }
    .dk-dialog-btns button { flex:1; padding:12px; border:none; border-radius:12px; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.15s; }
    .dk-btn-confirm { background:#8c36ff; color:white; }
    .dk-btn-cancel { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); }
    .dk-btn-danger { background:rgba(255,68,68,0.15); color:#ff4444; border:1px solid rgba(255,68,68,0.3); }
    .dk-btn-danger:hover { background:#ff4444 !important; color:white; }
    .card {
      background: rgba(20,20,20,0.7);
      border: 1px solid rgba(128,0,255,0.25);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
    }
    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar-section {
      text-align: center;
      margin-bottom: 24px;
    }
    .avatar {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #8c36ff, #6b10cc);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      font-size: 40px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0,0,0,0.5);
      border: 1.5px solid rgba(128,0,255,0.25);
      border-radius: 14px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus, select:focus {
      border-color: #8c36ff;
      background: rgba(0,0,0,0.7);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8c36ff 0%, #6b10cc 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-danger {
      background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .info-label {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
    }
    .info-value {
      font-weight: 600;
    }
    .admin-badge {
      background: #8c36ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      display: inline-block;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(20,20,20,0.95);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.28s;
      z-index: 9000;
      pointer-events: none;
      backdrop-filter: blur(10px);
      border: 1px solid #8c36ff;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: rgba(180,40,40,0.95); border-color: #ff4444; }
    .toast.ok { background: rgba(0,120,80,0.95); border-color: #00cc88; }
    .bsp {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #8c36ff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  
    .header { display: flex; flex-direction: column; align-items: flex-start; padding: 16px 0 0; margin-bottom: 20px; gap: 10px; }
    .devra-logo { font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; color: #8c36ff; text-shadow: 0 0 24px rgba(140,54,255,0.5); letter-spacing: -1px; line-height: 1; }
    .nav-row { display: flex; gap: 20px; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: rgba(255,255,255,0.45); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; text-decoration: none; transition: color 0.2s; }
    .nav-item i { font-size: 18px; }
    .nav-item:hover, .nav-item.active { color: #8c36ff; }
    .publish-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background: #25D366; color: white; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 14px rgba(37,211,102,0.35); transition: all 0.2s; }
    .publish-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,211,102,0.5); }

  </style>
</head>
<body>
<div class="bg"></div>
<div class="page">
  <div class="header">
  <div class="devra-logo">Devra</div>
  <div class="nav-row"><a class="nav-item " onclick="location.href='builder.html'"><i class="fas fa-hammer"></i><span>Builder</span></a><a class="nav-item " onclick="location.href='builds.html'"><i class="fas fa-layer-group"></i><span>Builds</span></a><a class="nav-item active" onclick="location.href='account.html'"><i class="fas fa-user"></i><span>Account</span></a></div>
</div>
<div class="card">
    <div class="card-title">
      <i class="fas fa-user-circle" style="color:#8c36ff"></i>
      Profile Information
    </div>
    
    <div class="avatar-section">
      <div class="avatar" id="avatarInitials">JD</div>
      <div id="adminBadge"></div>
    </div>

    <div class="info-row">
      <span class="info-label">Email</span>
      <span class="info-value" id="profileEmail">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Member Since</span>
      <span class="info-value" id="profileJoined">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Role</span>
      <span class="info-value" id="profileRole">-</span>
    </div>

    <input type="text" id="fullName" placeholder="Full Name">
    <button class="btn" onclick="updateProfile()">Update Profile</button>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-lock" style="color:#8c36ff"></i>
      Change Password
    </div>
    <input type="password" id="currentPassword" placeholder="Current Password">
    <input type="password" id="newPassword" placeholder="New Password (min. 8 characters)">
    <input type="password" id="confirmPassword" placeholder="Confirm New Password">
    <button class="btn" onclick="changePassword()">Update Password</button>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-envelope" style="color:#8c36ff"></i>
      Feedback & Support
    </div>
    <textarea id="feedbackMsg" rows="4" placeholder="Send us your feedback, feature requests, or report an issue..." style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1.5px solid rgba(128,0,255,0.25); border-radius:14px; color:white; margin-bottom:12px;"></textarea>
    <button class="btn" onclick="sendFeedback()">Send Feedback</button>
  </div>

  <div class="card">
    <div class="card-title">
      <i class="fas fa-trash-alt" style="color:#ff4444"></i>
      Danger Zone
    </div>
    <button class="btn btn-danger" onclick="deleteAccount()">Delete My Account</button>
    <p style="font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 12px; text-align: center;">
      This will permanently delete your account and all associated data.
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = "https://jxdobdllxihmfssodrka.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_c6Rv2f_Rfgk6PDHVYBAcvQ_VxC2rENW";

  const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let userProfile = null;

  async function checkAuth() {
    let { data: { session } } = await _supabase.auth.getSession();
    if (!session) {
      await new Promise(resolve => {
        const { data: { subscription } } = _supabase.auth.onAuthStateChange((event, sess) => {
          subscription.unsubscribe(); session = sess; resolve();
        });
        setTimeout(resolve, 2000);
      });
    }
    if (!session || !session.user) { window.location.href = 'index.html'; return; }
    currentUser = session.user;
    await loadProfile();
  }

  async function loadProfile() {
    const { data: profile, error } = await _supabase
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    const u = currentUser;
    // Also check auth user_metadata for name (fallback storage)
    const metaName = u.user_metadata?.full_name || '';

    if (error || !profile) {
      document.getElementById('profileEmail').innerText = u.email || '-';
      document.getElementById('profileJoined').innerText = u.created_at ? new Date(u.created_at).toLocaleDateString() : '-';
      document.getElementById('profileRole').innerText = 'User';
      document.getElementById('fullName').value = metaName;
      const initials = (metaName || u.email || 'U').split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('avatarInitials').innerText = initials;
      return;
    }

    userProfile = profile;

    const displayName = profile.full_name || metaName || '';
    document.getElementById('profileEmail').innerText = profile.email || u.email;
    document.getElementById('profileJoined').innerText = new Date(profile.created_at || u.created_at).toLocaleDateString();
    document.getElementById('profileRole').innerHTML = profile.role === 'admin' ? '<span class="admin-badge">👑 Admin</span>' : (profile.role || 'User');
    document.getElementById('fullName').value = displayName;

    const initials = (displayName || profile.email || u.email).split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase();
    document.getElementById('avatarInitials').innerText = initials;

    if (profile.role === 'admin') {
      document.getElementById('adminBadge').innerHTML = '<span class="admin-badge" style="margin-top:8px">👑 Administrator Access</span>';
    }
  }

  function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  async function updateProfile() {
    const fullName = document.getElementById('fullName').value.trim();
    const btn = document.querySelector('[onclick="updateProfile()"]');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    // Try upsert first (avoids the RLS UPDATE recursion by using INSERT ON CONFLICT)
    const { error: upsertError } = await _supabase
      .from('profiles')
      .upsert({
        id: currentUser.id,
        email: currentUser.email,
        full_name: fullName,
        updated_at: new Date().toISOString()
      }, { onConflict: 'id' });

    if (upsertError) {
      // Fallback: store name in Supabase auth user_metadata (bypasses profiles table RLS entirely)
      const { error: metaError } = await _supabase.auth.updateUser({
        data: { full_name: fullName }
      });

      if (metaError) {
        toast('Update failed: ' + metaError.message, 'err');
      } else {
        // Update display immediately from auth metadata
        document.getElementById('fullName').value = fullName;
        const initials = fullName.split(' ').filter(Boolean).map(n => n[0]).join('').substring(0, 2).toUpperCase() || currentUser.email.substring(0, 2).toUpperCase();
        document.getElementById('avatarInitials').innerText = initials;
        toast('Profile updated!', 'ok');
      }
    } else {
      toast('Profile updated!', 'ok');
      await loadProfile();
    }

    btn.disabled = false;
    btn.textContent = 'Update Profile';
  }

  async function changePassword() {
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (!current || !newPass || !confirm) {
      toast('Please fill in all password fields', 'err');
      return;
    }
    if (newPass.length < 8) {
      toast('New password must be at least 8 characters', 'err');
      return;
    }
    if (newPass !== confirm) {
      toast('New passwords do not match', 'err');
      return;
    }

    // Verify current password by attempting to sign in
    const { error: signError } = await _supabase.auth.signInWithPassword({
      email: currentUser.email,
      password: current
    });

    if (signError) {
      toast('Current password is incorrect', 'err');
      return;
    }

    const { error } = await _supabase.auth.updateUser({ password: newPass });
    
    if (error) {
      toast(error.message, 'err');
    } else {
      toast('Password updated! Please sign in again.', 'ok');
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmPassword').value = '';
      setTimeout(() => logout(), 2000);
    }
  }

  async function sendFeedback() {
    const message = document.getElementById('feedbackMsg').value.trim();
    if (!message) {
      toast('Please enter your feedback', 'err');
      return;
    }

    const { error } = await _supabase.from('feedbacks').insert({
      user_id: currentUser.id,
      message: message,
      status: 'pending'
    });

    if (error) {
      toast(error.message, 'err');
    } else {
      toast('Feedback sent! Thank you.', 'ok');
      document.getElementById('feedbackMsg').value = '';
    }
  }

  async function deleteAccount() {
    const ok = await dkConfirm('This will permanently delete your account and ALL data. This cannot be undone.', '⚠️', 'Delete Account', true);
    if (!ok) return;
    const typed = await dkPrompt('Type DELETE to confirm account deletion', 'DELETE', '🗑️', 'Final Confirmation');
    if (typed !== 'DELETE') { toast('Account deletion cancelled', ''); return; }
    
    toast('Deleting account...', '');
    
    // Delete user data
    await _supabase.from('sites').delete().eq('user_id', currentUser.id);
    await _supabase.from('builds').delete().eq('user_id', currentUser.id);
    await _supabase.from('feedbacks').delete().eq('user_id', currentUser.id);
    await _supabase.from('notifications').delete().eq('user_id', currentUser.id);
    await _supabase.from('profiles').delete().eq('id', currentUser.id);
    
    // Delete auth user
    const { error } = await _supabase.auth.admin.deleteUser(currentUser.id);
    // If admin delete fails, try sign out and let user delete via settings
    
    await _supabase.auth.signOut();
    toast('Account deleted. Redirecting...', 'ok');
    setTimeout(() => window.location.href = 'index.html', 2000);
  }

  async function logout() {
    await _supabase.auth.signOut();
    window.location.href = 'index.html';
  }

  window.updateProfile = updateProfile;
  window.changePassword = changePassword;
  window.sendFeedback = sendFeedback;
  window.deleteAccount = deleteAccount;
  window.logout = logout;

  // ── Custom Dialog ──
  function dkConfirm(msg, icon='⚠️', title='Confirm', dangerBtn=false) {
    return new Promise(res => {
      document.getElementById('dkDialogIcon').textContent = icon;
      document.getElementById('dkDialogTitle').textContent = title;
      document.getElementById('dkDialogMsg').textContent = msg;
      document.getElementById('dkDialogInput').style.display='none';
      document.getElementById('dkDialogBtns').innerHTML = `<button class="${dangerBtn?'dk-btn-danger':'dk-btn-confirm'}" onclick="dkResolve(true)">Confirm</button><button class="dk-btn-cancel" onclick="dkResolve(false)">Cancel</button>`;
      document.getElementById('dkDialogOverlay').classList.add('show');
      window._dkResolve = res;
    });
  }
  function dkPrompt(msg, placeholder='', icon='✏️', title='Input') {
    return new Promise(res => {
      document.getElementById('dkDialogIcon').textContent = icon;
      document.getElementById('dkDialogTitle').textContent = title;
      document.getElementById('dkDialogMsg').textContent = msg;
      const inp = document.getElementById('dkDialogInput');
      inp.style.display='block'; inp.value=''; inp.placeholder=placeholder||'';
      document.getElementById('dkDialogBtns').innerHTML = `<button class="dk-btn-confirm" onclick="dkResolve(document.getElementById('dkDialogInput').value)">OK</button><button class="dk-btn-cancel" onclick="dkResolve(null)">Cancel</button>`;
      document.getElementById('dkDialogOverlay').classList.add('show');
      window._dkResolve = res;
    });
  }
  function dkResolve(val) {
    document.getElementById('dkDialogOverlay').classList.remove('show');
    if(window._dkResolve) { window._dkResolve(val); window._dkResolve=null; }
  }
  window.dkResolve = dkResolve;

  checkAuth();
</script>
<div class="dk-dialog-overlay" id="dkDialogOverlay">
  <div class="dk-dialog">
    <div class="dk-dialog-icon" id="dkDialogIcon">⚠️</div>
    <div class="dk-dialog-title" id="dkDialogTitle">Confirm</div>
    <div class="dk-dialog-msg" id="dkDialogMsg"></div>
    <input class="dk-dialog-input" id="dkDialogInput" type="text" style="display:none">
    <div class="dk-dialog-btns" id="dkDialogBtns"></div>
  </div>
</div>
</body>
</html>
